name: Connect 4 Move

on:
  issues:
    types: [opened]

concurrency:
  group: connect4-game
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process-move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process move
        id: process
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: python process_move.py

      - name: Read result
        id: result
        run: |
          if [ -f result.txt ]; then
            {
              echo "message<<EOF"
              cat result.txt
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "message=❌ Erro desconhecido ao processar a jogada." >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game_state.json board.svg
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "🎮 Jogada da Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        uses: actions/github-script@v7
        env:
          RESULT_MESSAGE: ${{ steps.result.outputs.message }}
        with:
          script: |
            const message = process.env.RESULT_MESSAGE || '❌ Erro desconhecido.';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${message}\n\n👉 [Ver o tabuleiro](${repoUrl}#-tabuleiro)`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
